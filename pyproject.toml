[project]
name = "sharing-aware-kv-cache"
version = "0.1.0"
description = "Session- and sharing-aware request scheduling on top of vLLM."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "vllm>=0.10.2,<0.11.0",
    "transformers>=4.55,<4.58",
    "pandas>=2.0,<2.3",
    "matplotlib>=3.7,<3.10",
    "seaborn>=0.13,<0.14",
    # Note: numpy is intentionally NOT a direct dep — vLLM owns the numpy
    # install on the GPU host. Listing numpy here causes pip to upgrade it
    # under vLLM, leading to:
    #   ValueError: numpy.dtype size changed, may indicate binary incompatibility
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kvcache" = ["py.typed"]

